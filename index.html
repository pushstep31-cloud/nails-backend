<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>График мастеров</title>
    
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">
    <meta name="theme-color" content="#F8F9FA"/>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #F8F9FA;
            --text-main: #2C2C2C;
            --card-bg: #FFFFFF;
            --shadow: 0 2px 8px rgba(0,0,0,0.05);
            
            --diana-color: #2196F3;
            --diana-bg: #E3F2FD;
            --nastya-color: #F44336;
            --nastya-bg: #FFEBEE;
            
            --hour-height: 40px; 
            --nav-text-color: #888888;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-color); color: var(--text-main); padding-bottom: 90px; overflow-x: hidden; }

        .loading-screen { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: var(--bg-color); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; }
        .loading-screen.hidden { display: none; }
        .spinner { width: 50px; height: 50px; border: 5px solid #E8F5E9; border-top: 5px solid #A5D6A7; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .auth-screen { display: flex; flex-direction: column; gap: 15px; margin: 50px auto; max-width: 400px; padding: 20px; }
        .btn { background: var(--card-bg); color: var(--text-main); border: none; padding: 16px; border-radius: 16px; font-size: 16px; font-weight: 600; cursor: pointer; box-shadow: var(--shadow); text-align: center; width: 100%; transition: transform 0.1s; }
        .btn:active { transform: scale(0.97); }
        .btn.primary { background: #E8F5E9; color: #1B5E20; box-shadow: inset 0 0 0 2px #A5D6A7; }
        .btn.active { background: #E8F5E9; color: #1B5E20; box-shadow: inset 0 0 0 2px #A5D6A7; }
        .btn.danger { background: #FFEBEE; color: #C62828; box-shadow: inset 0 0 0 2px #FFCDD2; }
        .input-group { display: flex; flex-direction: column; gap: 8px; margin-top: 15px; }
        input[type="password"], input[type="text"], input[type="date"] { background: var(--card-bg); border: none; padding: 16px; border-radius: 16px; font-size: 16px; box-shadow: var(--shadow); outline: none; color: var(--text-main); width: 100%; margin-bottom: 15px; }

        .hidden { display: none !important; }

        /* ШАПКА КАЛЕНДАРЯ */
        .calendar-header { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: var(--card-bg); box-shadow: 0 2px 5px rgba(0,0,0,0.05); position: sticky; top: 0; z-index: 10; }
        .week-nav { background: none; border: none; font-size: 20px; cursor: pointer; color: var(--text-main); }
        .week-range { font-weight: 700; font-size: 16px; }

        /* СЕТКА */
        .grid-container { display: flex; background: var(--card-bg); margin: 5px; border-radius: 12px; box-shadow: var(--shadow); overflow: hidden; touch-action: pan-y; }
        .animate-grid { animation: slideIn 0.3s ease-out; }
        @keyframes slideIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }

        .time-column { width: 36px; min-width: 36px; background: #FAFAFA; border-right: 1px solid #EEE; }
        .time-label { height: var(--hour-height); font-size: 9px; color: #999; text-align: right; padding-right: 3px; padding-top: 6px; border-bottom: 1px dashed #EEE; }
        
        .days-wrapper { display: flex; flex: 1; position: relative; }
        .day-column { flex: 1; min-width: 0; border-right: 1px solid #EEE; position: relative; }
        .day-column:last-child { border-right: none; }
        
        .day-header { position: sticky; top: 0; background: var(--card-bg); padding: 6px 2px; text-align: center; border-bottom: 2px solid #EEE; z-index: 5; }
        .day-name { font-weight: 700; font-size: 10px; }
        .day-date { font-size: 9px; color: #777; margin-top: 2px; }
        .day-header.today { background: var(--diana-bg); }
        .day-header.today .day-name { color: var(--diana-color); }

        .hour-slot { height: var(--hour-height); border-bottom: 1px solid #F0F0F0; cursor: pointer; transition: background 0.2s; }
        .hour-slot:active { background: #E3F2FD; }

        .shift-block { 
            position: absolute; left: 1px; right: 1px; border-radius: 4px; padding: 2px; 
            font-size: 7px; overflow: hidden; box-shadow: 0 1px 2px rgba(0,0,0,0.1); 
            cursor: grab; z-index: 2; display: flex; flex-direction: column;
            transition: transform 0.1s, box-shadow 0.1s, opacity 0.2s;
        }
        .shift-block:active { cursor: grabbing; box-shadow: 0 4px 10px rgba(0,0,0,0.2); transform: scale(1.05); z-index: 10; }
        .shift-block.dragging { opacity: 0.5; transform: scale(0.95); }
        
        .shift-block.diana { background: var(--diana-bg); border-left: 2px solid var(--diana-color); color: var(--diana-color); }
        .shift-block.nastya { background: var(--nastya-bg); border-left: 2px solid var(--nastya-color); color: var(--nastya-color); }
        
        .shift-title { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .shift-time { font-size: 7px; font-weight: 600; }

        /* СОВРЕМЕННОЕ НИЖНЕЕ МЕНЮ */
        .bottom-nav { 
            position: fixed; bottom: 15px; left: 15px; right: 15px; height: 70px; 
            background: rgba(255, 255, 255, 0.85); 
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border-radius: 24px; 
            display: flex; justify-content: space-around; align-items: center; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.1), 0 2px 8px rgba(0,0,0,0.05), inset 0 1px 0 rgba(255,255,255,1); 
            z-index: 100; border: 1px solid rgba(0,0,0,0.03);
        }
        
        .nav-item { 
            display: flex; flex-direction: column; align-items: center; 
            color: var(--nav-text-color); 
            font-size: 10px; font-weight: 600; cursor: pointer; 
            transition: transform 0.2s, color 0.2s; 
            width: 60px; padding: 10px 0; 
        }
        .nav-item:active { transform: scale(0.85); } 
        
        .nav-icon { 
            width: 22px; height: 22px; margin-bottom: 4px; 
            fill: none; stroke: currentColor; stroke-width: 2; 
            stroke-linecap: round; stroke-linejoin: round;
        }
        
        .nav-add-btn { 
            background: linear-gradient(135deg, #42A5F5, #1E88E5); 
            color: white; width: 56px; height: 56px; border-radius: 50%; 
            display: flex; justify-content: center; align-items: center; font-size: 32px; 
            margin-top: -35px; 
            box-shadow: 0 12px 24px rgba(33, 150, 243, 0.4), 0 4px 8px rgba(33, 150, 243, 0.3), inset 0 2px 4px rgba(255,255,255,0.4), inset 0 -2px 4px rgba(0,0,0,0.2); 
            cursor: pointer; transition: transform 0.15s, box-shadow 0.15s; border: 2px solid rgba(255,255,255,0.2);
        }
        .nav-add-btn:active { 
            transform: scale(0.9) translateY(4px); 
            box-shadow: 0 2px 6px rgba(33, 150, 243, 0.5), 0 1px 2px rgba(33, 150, 243, 0.3), inset 0 2px 6px rgba(0,0,0,0.3);
        }

        /* МОДАЛЬНЫЕ ОКНА */
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.4); display: flex; align-items: flex-end; justify-content: center; z-index: 1000; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal { background: var(--card-bg); width: 100%; max-width: 500px; border-radius: 20px 20px 0 0; padding: 24px; transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); max-height: 90vh; overflow-y: auto; position: relative; }
        .modal-overlay.active .modal { transform: translateY(0); }
        
        .close-cross { position: absolute; top: 15px; right: 15px; font-size: 24px; color: #999; cursor: pointer; line-height: 1; padding: 5px; transition: color 0.2s; }
        .close-cross:active { color: #333; }
        .modal h2 { font-size: 20px; margin-bottom: 15px; text-align: center; padding: 0 20px; }

        /* Кнопки длительности */
        .duration-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 20px; }
        .duration-btn { background: #F0F0F0; padding: 14px 0; text-align: center; border-radius: 12px; font-weight: 600; font-size: 15px; cursor: pointer; transition: all 0.2s; color: #555; border: 1px solid transparent; }
        .duration-btn.active { background: #E3F2FD; color: #1976D2; border-color: #90CAF9; }

        .label { font-weight: 600; margin-bottom: 5px; display: block; font-size: 13px; }
        
        .action-modal { text-align: center; }
        .action-info { font-size: 16px; font-weight: 600; margin-bottom: 20px; color: #555; }
        
        .alert-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center; z-index: 1100; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
        .alert-overlay.active { opacity: 1; pointer-events: auto; }
        .alert-box { background: var(--card-bg); padding: 20px; border-radius: 16px; text-align: center; max-width: 300px; width: 90%; }
        .alert-btn { background: var(--diana-color); color: white; border: none; padding: 10px; border-radius: 8px; width: 100%; font-weight: bold; margin-top: 15px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="loading-screen" class="loading-screen">
        <div class="spinner"></div>
        <div style="font-weight:600; color:#1B5E20;">Загрузка...</div>
    </div>

    <div id="custom-alert" class="alert-overlay">
        <div class="alert-box">
            <div style="font-size:30px;">⚠️</div>
            <div style="font-weight:bold; margin:10px 0;" id="alert-text">Текст</div>
            <button class="alert-btn" onclick="closeAlert()">ОК</button>
        </div>
    </div>

    <div id="auth-screen" class="auth-screen hidden">
        <h1 style="text-align:center;">💅 График</h1>
        <p style="text-align: center; color: #777;">Кто вы?</p>
        <div id="login-users-container" style="display: flex; gap: 10px;"></div>
        <div class="input-group">
            <input type="password" id="password" placeholder="Пароль">
            <button class="btn primary" onclick="login()">Войти</button>
        </div>
    </div>

    <div id="main-screen" class="hidden">
        <div class="calendar-header">
            <button class="week-nav" onclick="changeWeek(-1)">←</button>
            <div class="week-range" id="week-range">Загрузка...</div>
            <button class="week-nav" onclick="changeWeek(1)">→</button>
        </div>

        <div class="grid-container" id="grid-container">
            <div class="time-column" id="time-column"></div>
            <div class="days-wrapper" id="days-wrapper"></div>
        </div>

        <div class="bottom-nav">
            <div class="nav-item" onclick="resetToToday()">
                <svg class="nav-icon" viewBox="0 0 24 24">
                    <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                    <line x1="16" y1="2" x2="16" y2="6"></line>
                    <line x1="8" y1="2" x2="8" y2="6"></line>
                    <line x1="3" y1="10" x2="21" y2="10"></line>
                </svg>
                <div>Сегодня</div>
            </div>
            
            <div class="nav-add-btn" onclick="openModal()">
                <span>+</span>
            </div>
            
            <div class="nav-item" onclick="openSettingsModal()">
                <svg class="nav-icon" viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                </svg>
                <div>Профиль</div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="action-modal">
        <div class="modal action-modal">
            <div class="close-cross" onclick="closeActionModal()">✕</div>
            <h2 id="action-title">Смена</h2>
            <div class="action-info" id="action-info"></div>
            <button class="btn primary" onclick="actionEdit()">✏️ Редактировать</button>
            <button class="btn danger" style="margin-top:10px;" id="action-delete-btn" onclick="actionDelete()">🗑️ Удалить смену</button>
            <button class="btn" style="margin-top:10px;" onclick="closeActionModal()">Отмена</button>
        </div>
    </div>

    <div class="modal-overlay" id="modal">
        <div class="modal">
            <div class="close-cross" onclick="closeModal()">✕</div>
            <h2 id="modal-title">Смена</h2>
            <label class="label">Дата</label>
            <input type="date" id="input-date">
            <label class="label">Услуга</label>
            <input type="text" id="input-comment" value="Педикюр">
            
            <label class="label" style="margin-top: 10px;">Выберите длительность:</label>
            <div class="duration-grid">
                <div class="duration-btn" onclick="setDuration(1)">1 час</div>
                <div class="duration-btn" onclick="setDuration(1.5)">1,5 часа</div>
                <div class="duration-btn" onclick="setDuration(2)">2 часа</div>
                <div class="duration-btn" onclick="setDuration(2.5)">2,5 часа</div>
            </div>

            <div id="time-display" style="text-align:center; font-weight:700; color:var(--diana-color); margin:15px 0; font-size: 18px;">
                10:00 — 12:00
            </div>
            
            <button class="btn primary" id="save-btn" onclick="saveShift()">Сохранить</button>
            <button class="btn" style="margin-top:10px;" onclick="closeModal()">Отмена</button>
        </div>
    </div>

    <div class="modal-overlay" id="settings-modal">
        <div class="modal">
            <div class="close-cross" onclick="closeSettingsModal()">✕</div>
            <h2>Настройки</h2>
            <label class="label">Новое имя</label>
            <input type="text" id="settings-name">
            <label class="label">Новый пароль</label>
            <input type="password" id="settings-password" placeholder="Не менять">
            <button class="btn primary" onclick="saveSettings()">Сохранить</button>
            <button class="btn" style="margin-top:10px; color:red;" onclick="logout()">Выйти</button>
            <button class="btn" style="margin-top:10px;" onclick="closeSettingsModal()">Закрыть</button>
        </div>
    </div>

    <script>
        window.onerror = function(msg) { alert("Ошибка: " + msg); return false; };

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').then(registration => {
                    console.log('SW registered');
                }).catch(registrationError => {
                    console.log('SW registration failed: ', registrationError);
                });
            });
        }

        let backPressCount = 0;
        let backPressTimer = null;
        history.pushState({ page: "main" }, "");

        window.addEventListener('popstate', function (e) {
            const modal = document.getElementById('modal');
            const settingsModal = document.getElementById('settings-modal');
            const actionModal = document.getElementById('action-modal');
            
            if (modal.classList.contains('active')) { closeModal(); history.pushState({ page: "main" }, ""); return; }
            if (settingsModal.classList.contains('active')) { closeSettingsModal(); history.pushState({ page: "main" }, ""); return; }
            if (actionModal.classList.contains('active')) { closeActionModal(); history.pushState({ page: "main" }, ""); return; }

            if (backPressCount === 0) {
                backPressCount++;
                history.pushState({ page: "main" }, ""); 
                showAlert("Нажмите 'Назад' еще раз, чтобы выйти из приложения.");
                backPressTimer = setTimeout(() => { backPressCount = 0; }, 2000); 
            } else {
                clearTimeout(backPressTimer);
                history.back();
            }
        });

        const API_URL = "https://nailscalendar.onrender.com"; 
        
        let currentMaster = null;
        let currentWeekOffset = 0;
        let selectedStart = "";
        let selectedEnd = "";
        let shiftsDB = []; 
        let editingShiftId = null; 
        let activeShiftId = null;

        const HOURS = [];
        for (let h = 8; h <= 23; h++) HOURS.push(h);
        
        const ALL_TIMES = [];
        for (let h = 8; h < 24; h++) {
            ALL_TIMES.push(`${h.toString().padStart(2, '0')}:00`);
            ALL_TIMES.push(`${h.toString().padStart(2, '0')}:30`);
        }

        function showLoading() { document.getElementById('loading-screen').classList.remove('hidden'); }
        function hideLoading() { document.getElementById('loading-screen').classList.add('hidden'); }
        function showAlert(msg) { document.getElementById('alert-text').innerText = msg; document.getElementById('custom-alert').classList.add('active'); }
        function closeAlert() { document.getElementById('custom-alert').classList.remove('active'); }

        async function fetchWithTimeout(resource, options = {}) {
            const { timeout = 10000 } = options;
            const controller = new AbortController();
            const id = setTimeout(() => controller.abort(), timeout);
            const response = await fetch(resource, { ...options, signal: controller.signal });
            clearTimeout(id);
            return response;
        }

        async function loadUsers() {
            try {
                const res = await fetchWithTimeout(`${API_URL}/users`);
                const users = await res.json();
                const container = document.getElementById('login-users-container');
                container.innerHTML = '';
                users.forEach(u => {
                    const b = document.createElement('button');
                    b.className = 'btn'; b.innerText = u.name;
                    b.onclick = () => {
                        document.querySelectorAll('#login-users-container .btn').forEach(x => x.classList.remove('active'));
                        b.classList.add('active'); currentMaster = u.name;
                    };
                    container.appendChild(b);
                });
            } catch (e) { 
                console.error(e); 
                showAlert("Сервер просыпается. Подождите 30 секунд и обновите страницу.");
                hideLoading();
                document.getElementById('auth-screen').classList.remove('hidden');
            }
        }

        async function login() {
            const pwd = document.getElementById('password').value;
            if (!currentMaster) return showAlert("Выберите имя");
            showLoading();
            try {
                const res = await fetchWithTimeout(`${API_URL}/login`, {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ name: currentMaster, password: pwd })
                });
                if (res.ok) {
                    localStorage.setItem('nailsMaster', currentMaster);
                    document.getElementById('auth-screen').classList.add('hidden');
                    document.getElementById('main-screen').classList.remove('hidden');
                    loadShifts();
                } else { hideLoading(); showAlert("Неверный пароль"); }
            } catch (e) { hideLoading(); showAlert("Сервер не отвечает. Обновите страницу."); }
        }

        function logout() { localStorage.removeItem('nailsMaster'); location.reload(); }

        async function loadShifts() {
            try {
                const res = await fetchWithTimeout(`${API_URL}/shifts`);
                shiftsDB = await res.json();
                renderGrid();
                hideLoading();
            } catch (e) { 
                hideLoading(); 
                showAlert("Ошибка загрузки данных."); 
            }
        }

        function getWeekDates(offset) {
            const today = new Date();
            const dayOfWeek = today.getDay() === 0 ? 6 : today.getDay() - 1; 
            const startOfWeek = new Date(today);
            startOfWeek.setDate(today.getDate() - dayOfWeek + (offset * 7));
            return Array.from({length: 7}, (_, i) => {
                const d = new Date(startOfWeek); d.setDate(startOfWeek.getDate() + i); return d;
            });
        }

        function formatDate(date) {
            return `${date.getFullYear()}-${(date.getMonth() + 1).toString().padStart(2, '0')}-${date.getDate().toString().padStart(2, '0')}`;
        }

        // --- ЛОГИКА ПЕРЕТАСКИВАНИЯ БЕЗ ЗАГРУЗКИ ---
        let draggedElement = null;
        let draggedShiftId = null;

        function renderGrid() {
            const dates = getWeekDates(currentWeekOffset);
            const startStr = dates[0].toLocaleDateString('ru-RU', {day: '2-digit', month: '2-digit'});
            const endStr = dates[6].toLocaleDateString('ru-RU', {day: '2-digit', month: '2-digit'});
            document.getElementById('week-range').innerText = `${startStr} — ${endStr}`;

            const timeCol = document.getElementById('time-column');
            timeCol.innerHTML = '<div style="height:33px;"></div>'; 
            HOURS.forEach(h => {
                timeCol.innerHTML += `<div class="time-label">${h.toString().padStart(2, '0')}:00</div>`;
            });

            const daysWrapper = document.getElementById('days-wrapper');
            daysWrapper.innerHTML = '';
            const todayStr = formatDate(new Date());
            const daysRu = ["Пн", "Вт", "Ср", "Чт", "Пт", "Сб", "Вс"];

            dates.forEach((date, index) => {
                const dateStr = formatDate(date);
                const isToday = dateStr === todayStr;
                
                const col = document.createElement('div');
                col.className = 'day-column';
                col.dataset.date = dateStr; 
                col.innerHTML = `
                    <div class="day-header ${isToday ? 'today' : ''}">
                        <div class="day-name">${daysRu[index]}</div>
                        <div class="day-date">${date.getDate()}</div>
                    </div>
                `;

                const slotsContainer = document.createElement('div');
                slotsContainer.style.position = 'relative';
                
                HOURS.forEach(h => {
                    const slot = document.createElement('div');
                    slot.className = 'hour-slot';
                    slot.dataset.time = `${h.toString().padStart(2, '0')}:00`;
                    slot.onclick = () => openModalWithTime(dateStr, slot.dataset.time);
                    slotsContainer.appendChild(slot);
                });

                const shifts = shiftsDB.filter(s => s.date === dateStr);
                shifts.forEach(shift => {
                    const block = document.createElement('div');
                    block.className = `shift-block ${shift.master === 'Диана' ? 'diana' : 'nastya'}`;
                    block.dataset.id = shift.id;
                    block.draggable = (shift.master === currentMaster);
                    
                    const startParts = shift.start.split(':');
                    const endParts = shift.end.split(':');
                    const startMins = parseInt(startParts[0]) * 60 + parseInt(startParts[1]);
                    const endMins = parseInt(endParts[0]) * 60 + parseInt(endParts[1]);
                    
                    const topMins = startMins - (8 * 60);
                    const durationMins = endMins - startMins;
                    
                    block.style.top = `${(topMins / 60) * 40}px`;
                    block.style.height = `${(durationMins / 60) * 40}px`;

                    block.innerHTML = `
                        <div class="shift-title">${shift.master}</div>
                        <div class="shift-time">${shift.start.substring(0,5)}</div>
                    `;

                    if (shift.master === currentMaster) {
                        block.ondragstart = (e) => {
                            draggedElement = block;
                            draggedShiftId = shift.id;
                            e.dataTransfer.effectAllowed = 'move';
                            block.classList.add('dragging');
                        };
                        block.ondragend = () => {
                            block.classList.remove('dragging');
                            draggedElement = null;
                        };
                        
                        let pressTimer;
                        block.addEventListener('touchstart', (e) => {
                            pressTimer = setTimeout(() => {
                                draggedElement = block;
                                draggedShiftId = shift.id;
                                block.classList.add('dragging');
                                if(navigator.vibrate) navigator.vibrate(50);
                            }, 500);
                        }, {passive: true});
                        
                        block.addEventListener('touchend', () => {
                            clearTimeout(pressTimer);
                            if (draggedElement) {
                                block.classList.remove('dragging');
                                draggedElement = null;
                            }
                        });
                    } else {
                        block.onclick = (e) => { 
                            e.stopPropagation(); 
                            showAlert(`${shift.master} уже работает с ${shift.start} до ${shift.end} (${shift.comment})`);
                        };
                    }
                    slotsContainer.appendChild(block);
                });

                col.ondragover = (e) => e.preventDefault(); 
                col.ondrop = (e) => {
                    e.preventDefault();
                    if (draggedShiftId) {
                        const newDate = col.dataset.date;
                        const rect = col.getBoundingClientRect();
                        const y = e.clientY - rect.top - 33; 
                        const hour = Math.floor(y / 40) + 8; 
                        moveShift(draggedShiftId, newDate, `${hour.toString().padStart(2, '0')}:00`);
                    }
                };

                col.addEventListener('touchend', (e) => {
                    if (draggedShiftId) {
                        const touch = e.changedTouches[0];
                        const newDate = col.dataset.date;
                        const rect = col.getBoundingClientRect();
                        const y = touch.clientY - rect.top - 33;
                        const hour = Math.floor(y / 40) + 8;
                        moveShift(draggedShiftId, newDate, `${hour.toString().padStart(2, '0')}:00`);
                        draggedShiftId = null;
                        draggedElement = null;
                    }
                });

                col.appendChild(slotsContainer);
                daysWrapper.appendChild(col);
            });

            const gridContainer = document.getElementById('grid-container');
            gridContainer.classList.remove('animate-grid');
            void gridContainer.offsetWidth;
            gridContainer.classList.add('animate-grid');
        }

        // ОБНОВЛЕННАЯ ФУНКЦИЯ (БЕЗ ЭКРАНА ЗАГРУЗКИ)
        async function moveShift(id, newDate, newStartTime) {
            const shift = shiftsDB.find(s => s.id === id);
            if (!shift) return;
            
            const startParts = shift.start.split(':');
            const endParts = shift.end.split(':');
            const durationMins = (parseInt(endParts[0]) * 60 + parseInt(endParts[1])) - (parseInt(startParts[0]) * 60 + parseInt(startParts[1]));
            
            const newStartParts = newStartTime.split(':');
            const newEndMins = (parseInt(newStartParts[0]) * 60 + parseInt(newStartParts[1])) + durationMins;
            const newEndH = Math.floor(newEndMins / 60);
            const newEndM = newEndMins % 60;
            const newEnd = `${newEndH.toString().padStart(2, '0')}:${newEndM.toString().padStart(2, '0')}`;

            const data = { master: currentMaster, date: newDate, start: newStartTime, end: newEnd, comment: shift.comment };
            
            // Отправляем на сервер в фоне (без showLoading)
            try {
                const res = await fetch(`${API_URL}/shifts/${id}`, { 
                    method: 'PUT', 
                    headers: {'Content-Type': 'application/json'}, 
                    body: JSON.stringify(data) 
                });
                
                if (!res.ok) {
                    const err = await res.json(); 
                    showAlert(err.detail);
                    loadShifts(); // Если ошибка (пересечение), возвращаем как было
                } else {
                    // Если успешно, обновляем локальную базу и перерисовываем без запроса к серверу
                    shift.date = newDate;
                    shift.start = newStartTime;
                    shift.end = newEnd;
                    renderGrid();
                }
            } catch (e) { 
                showAlert("Ошибка перемещения"); 
                loadShifts(); 
            }
        }

        function changeWeek(dir) { currentWeekOffset += dir; renderGrid(); }

        function resetToToday() {
            if (currentWeekOffset !== 0) {
                currentWeekOffset = 0;
                renderGrid();
            } else {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function openActionModal(id) {
            const shift = shiftsDB.find(s => s.id === id);
            if (!shift) return;
            activeShiftId = id;

            document.getElementById('action-info').innerText = `${shift.start} — ${shift.end} (${shift.comment})`;
            const delBtn = document.getElementById('action-delete-btn');
            if (shift.master === currentMaster) delBtn.style.display = 'block';
            else delBtn.style.display = 'none';

            document.getElementById('action-modal').classList.add('active');
            history.pushState({ page: "action" }, "");
        }

        function closeActionModal() {
            document.getElementById('action-modal').classList.remove('active');
            activeShiftId = null;
        }

        function actionEdit() {
            closeActionModal();
            editShift(activeShiftId);
        }

        async function actionDelete() {
            const shift = shiftsDB.find(s => s.id === activeShiftId);
            if (shift.master !== currentMaster) return showAlert("Вы не можете удалить чужую смену");
            
            if (confirm("Удалить эту смену?")) {
                showLoading();
                try {
                    await fetch(`${API_URL}/shifts/${activeShiftId}`, { method: 'DELETE' });
                    closeActionModal();
                    loadShifts();
                } catch (e) { hideLoading(); showAlert("Ошибка удаления"); }
            }
        }

        function updateTimeDisplay() {
            document.getElementById('time-display').innerText = `${selectedStart || '--:--'} — ${selectedEnd || '--:--'}`;
        }

        function openModal() {
            editingShiftId = null;
            document.getElementById('modal-title').innerText = "Новая смена";
            document.getElementById('save-btn').innerText = "Сохранить";
            document.getElementById('input-comment').value = "Педикюр";
            selectedStart = "10:00"; selectedEnd = "12:00"; 
            document.getElementById('input-date').value = formatDate(new Date());
            
            document.querySelectorAll('.duration-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.duration-btn')[2].classList.add('active'); 
            
            updateTimeDisplay();
            document.getElementById('modal').classList.add('active');
            history.pushState({ page: "edit" }, "");
        }

        function openModalWithTime(dateStr, timeStr) {
            editingShiftId = null;
            document.getElementById('modal-title').innerText = "Новая смена";
            document.getElementById('save-btn').innerText = "Сохранить";
            document.getElementById('input-comment').value = "Педикюр";
            
            selectedStart = timeStr;
            const hh = parseInt(timeStr.split(':')[0]);
            const nextHH = (hh + 2).toString().padStart(2, '0');
            selectedEnd = `${nextHH}:00`;
            
            document.getElementById('input-date').value = dateStr;
            
            document.querySelectorAll('.duration-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.duration-btn')[2].classList.add('active'); 
            
            updateTimeDisplay();
            document.getElementById('modal').classList.add('active');
            history.pushState({ page: "edit" }, "");
        }

        function editShift(id) {
            const shift = shiftsDB.find(s => s.id === id);
            if (!shift) return;
            editingShiftId = id;
            document.getElementById('modal-title').innerText = "Редактировать";
            document.getElementById('save-btn').innerText = "Обновить";
            document.getElementById('input-date').value = shift.date;
            document.getElementById('input-comment').value = shift.comment;
            selectedStart = shift.start; selectedEnd = shift.end;
            
            document.querySelectorAll('.duration-btn').forEach(b => b.classList.remove('active'));
            updateTimeDisplay();
            document.getElementById('modal').classList.add('active');
            history.pushState({ page: "edit" }, "");
        }

        function closeModal() { document.getElementById('modal').classList.remove('active'); }

        function setDuration(hours) {
            if (!selectedStart) {
                selectedStart = "10:00";
            }
            
            const parts = selectedStart.split(':');
            const startMins = parseInt(parts[0]) * 60 + parseInt(parts[1]);
            const endMins = startMins + (hours * 60);
            
            const endH = Math.floor(endMins / 60);
            const endM = endMins % 60;
            
            if (endH >= 24) {
                return showAlert("Смена не может заканчиваться позже 23:30");
            }
            
            selectedEnd = `${endH.toString().padStart(2, '0')}:${endM.toString().padStart(2, '0')}`;
            
            document.querySelectorAll('.duration-btn').forEach(b => b.classList.remove('active'));
            event.currentTarget.classList.add('active');
            
            updateTimeDisplay();
        }

        async function saveShift() {
            if (!selectedStart || !selectedEnd) return showAlert("Выберите время начала и окончания!");
            if (selectedStart >= selectedEnd) return showAlert("Конец должен быть позже начала");
            
            const date = document.getElementById('input-date').value;
            const comment = document.getElementById('input-comment').value;
            
            const data = { master: currentMaster, date, start: selectedStart, end: selectedEnd, comment };
            showLoading();
            try {
                let url = `${API_URL}/shifts`; let method = 'POST';
                if (editingShiftId) { url += `/${editingShiftId}`; method = 'PUT'; }
                
                const res = await fetch(url, { method, headers: {'Content-Type': 'application/json'}, body: JSON.stringify(data) });
                if (!res.ok) {
                    const err = await res.json(); hideLoading(); showAlert(err.detail);
                } else {
                    closeModal(); loadShifts();
                }
            } catch (e) { hideLoading(); showAlert("Ошибка сети"); }
        }

        function openSettingsModal() {
            document.getElementById('settings-name').value = currentMaster;
            document.getElementById('settings-password').value = '';
            document.getElementById('settings-modal').classList.add('active');
            history.pushState({ page: "settings" }, "");
        }
        function closeSettingsModal() { document.getElementById('settings-modal').classList.remove('active'); }
        
        async function saveSettings() {
            const newName = document.getElementById('settings-name').value.trim();
            const newPassword = document.getElementById('settings-password').value;
            if (!newName) return showAlert("Имя не может быть пустым");
            
            showLoading();
            try {
                const res = await fetch(`${API_URL}/users`, {
                    method: 'PUT', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ old_name: currentMaster, new_name: newName, new_password: newPassword })
                });
                if (res.ok) {
                    const data = await res.json();
                    currentMaster = data.new_name;
                    localStorage.setItem('nailsMaster', currentMaster);
                    closeSettingsModal();
                    showAlert("Настройки сохранены!");
                    loadShifts();
                } else {
                    const err = await res.json(); hideLoading(); showAlert(err.detail);
                }
            } catch (e) { hideLoading(); showAlert("Ошибка сети"); }
        }

        let touchStartX = 0;
        let touchStartY = 0;
        const swipeThreshold = 50;
        const gridContainer = document.getElementById('grid-container');

        gridContainer.addEventListener('touchstart', e => {
            touchStartX = e.changedTouches[0].screenX;
            touchStartY = e.changedTouches[0].screenY;
        }, { passive: true });

        gridContainer.addEventListener('touchend', e => {
            const touchEndX = e.changedTouches[0].screenX;
            const touchEndY = e.changedTouches[0].screenY;
            const diffX = touchEndX - touchStartX;
            const diffY = touchEndY - touchStartY;

            if (!draggedShiftId && Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > swipeThreshold) {
                if (diffX > 0) changeWeek(-1);
                else changeWeek(1);
            }
        }, { passive: true });

        window.onload = async function() {
            await loadUsers();
            const saved = localStorage.getItem('nailsMaster');
            if (saved) {
                currentMaster = saved;
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('main-screen').classList.remove('hidden');
                loadShifts();
            } else {
                document.getElementById('auth-screen').classList.remove('hidden');
                hideLoading();
            }
        };
    </script>
</body>
