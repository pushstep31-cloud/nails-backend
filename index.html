    <script>
        const API_URL = "https://nailscalendar.onrender.com"; 
        
        const PASSWORDS = { "Диана": "1111", "Настя": "2222" };
        let currentMaster = null;
        let currentWeekOffset = 0;
        let selectedStart = "10:00";
        let selectedEnd = "18:00";
        let shiftsDB = []; 
        let editingShiftId = null; 

        const ALL_TIMES = [];
        for (let h = 8; h < 24; h++) {
            ALL_TIMES.push(`${h.toString().padStart(2, '0')}:00`);
            ALL_TIMES.push(`${h.toString().padStart(2, '0')}:30`);
        }

        // --- ЛОГИКА КНОПКИ "НАЗАД" (С ЗАДЕРЖКОЙ 2 СЕКУНДЫ) ---
        let backPressCount = 0;
        let backPressTimer = null;

        history.pushState({ page: "main" }, "");

        window.addEventListener('popstate', function (e) {
            const modal = document.getElementById('modal');
            
            // Если открыто модальное окно - закрываем его
            if (modal.classList.contains('active')) {
                closeModal();
                history.pushState({ page: "main" }, "");
                return;
            }

            // Логика двойного нажатия
            if (backPressCount === 0) {
                backPressCount++;
                history.pushState({ page: "main" }, ""); 
                showAlert("Нажмите 'Назад' еще раз, чтобы выйти из приложения.");
                
                // Таймер: если не нажать второй раз за 2 секунды, сбрасываем счетчик
                backPressTimer = setTimeout(() => {
                    backPressCount = 0;
                }, 2000); 
            } else {
                // Второе нажатие в течение 2 секунд - выходим
                clearTimeout(backPressTimer);
                history.back();
            }
        });

        // --- УВЕДОМЛЕНИЯ И ЗАГРУЗКА ---
        function showLoading() { document.getElementById('loading-screen').classList.remove('hidden'); }
        function hideLoading() { document.getElementById('loading-screen').classList.add('hidden'); }

        function showAlert(message) {
            document.getElementById('alert-text').innerText = message;
            document.getElementById('custom-alert').classList.add('active');
        }
        function closeAlert() {
            document.getElementById('custom-alert').classList.remove('active');
        }

        // --- АВТОРИЗАЦИЯ ---
        window.onload = function() {
            const savedMaster = localStorage.getItem('nailsMaster');
            if (savedMaster) {
                currentMaster = savedMaster;
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('main-screen').classList.remove('hidden');
                document.getElementById('greeting').innerText = `💅 Привет, ${currentMaster}`;
                showLoading(); 
                loadShifts();
            }
        };

        function selectMaster(name) {
            document.getElementById('btn-diana').classList.remove('active');
            document.getElementById('btn-nastya').classList.remove('active');
            if (name === 'Диана') document.getElementById('btn-diana').classList.add('active');
            if (name === 'Настя') document.getElementById('btn-nastya').classList.add('active');
            currentMaster = name;
        }

        function login() {
            const pwd = document.getElementById('password').value;
            if (currentMaster && PASSWORDS[currentMaster] === pwd) {
                localStorage.setItem('nailsMaster', currentMaster);
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('main-screen').classList.remove('hidden');
                document.getElementById('greeting').innerText = `💅 Привет, ${currentMaster}`;
                showLoading(); 
                loadShifts(); 
            } else {
                showAlert("Выберите имя или неверный пароль!");
            }
        }

        function logout() {
            localStorage.removeItem('nailsMaster');
            location.reload();
        }

        // --- РАБОТА С СЕРВЕРОМ ---
        async function loadShifts() {
            try {
                const response = await fetch(`${API_URL}/shifts`);
                if (!response.ok) throw new Error("Ошибка сервера");
                shiftsDB = await response.json();
                renderCalendar(); 
                hideLoading(); 
            } catch (e) {
                console.error(e);
                hideLoading(); 
                showAlert("Не удалось загрузить данные. Сервер просыпается, подождите 30 секунд и обновите страницу.");
            }
        }

        async function saveShift() {
            if (selectedStart >= selectedEnd) {
                showAlert("Время окончания должно быть позже начала!");
                return;
            }

            const comment = document.getElementById('input-comment').value;
            const selectedDate = document.getElementById('input-date').value;

            if (!selectedDate) {
                showAlert("Пожалуйста, выберите дату!");
                return;
            }

            const shiftData = {
                master: currentMaster,
                date: selectedDate,
                start: selectedStart,
                end: selectedEnd,
                comment: comment
            };

            showLoading(); 
            try {
                let url = `${API_URL}/shifts`;
                let method = 'POST';

                if (editingShiftId !== null) {
                    url = `${API_URL}/shifts/${editingShiftId}`;
                    method = 'PUT';
                }

                const response = await fetch(url, {
                    method: method,
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(shiftData)
                });
                
                if (!response.ok) {
                    const error = await response.json();
                    hideLoading();
                    showAlert(error.detail); 
                } else {
                    closeModal();
                    loadShifts(); 
                }
            } catch (e) {
                hideLoading();
                showAlert("Ошибка соединения с сервером");
            }
        }

        async function deleteShift(id) {
            if (confirm("Удалить эту смену?")) {
                showLoading(); 
                try {
                    await fetch(`${API_URL}/shifts/${id}`, { method: 'DELETE' });
                    loadShifts(); 
                } catch (e) {
                    hideLoading();
                    showAlert("Ошибка удаления");
                }
            }
        }

        // --- ЛОГИКА КАЛЕНДАРЯ ---
        function getWeekDates(offset) {
            const today = new Date();
            const dayOfWeek = today.getDay() === 0 ? 6 : today.getDay() - 1; 
            const startOfWeek = new Date(today);
            startOfWeek.setDate(today.getDate() - dayOfWeek + (offset * 7));
            
            const dates = [];
            for (let i = 0; i < 7; i++) {
                const d = new Date(startOfWeek);
                d.setDate(startOfWeek.getDate() + i);
                dates.push(d);
            }
            return dates;
        }

        function formatDate(date) {
            const y = date.getFullYear();
            const m = (date.getMonth() + 1).toString().padStart(2, '0');
            const d = date.getDate().toString().padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        function renderCalendar() {
            const dates = getWeekDates(currentWeekOffset);
            const container = document.getElementById('calendar-container');
            container.innerHTML = '';

            const startStr = dates[0].toLocaleDateString('ru-RU', {day: '2-digit', month: '2-digit', year: 'numeric'});
            const endStr = dates[6].toLocaleDateString('ru-RU', {day: '2-digit', month: '2-digit', year: 'numeric'});
            document.getElementById('week-range').innerText = `${startStr} — ${endStr}`;

            const todayStr = formatDate(new Date());
            const daysRu = ["Пн", "Вт", "Ср", "Чт", "Пт", "Сб", "Вс"];

            dates.forEach((date, index) => {
                const dateStr = formatDate(date);
                const isToday = dateStr === todayStr;
                const dayTitle = `${daysRu[index]}, ${date.toLocaleDateString('ru-RU', {day: '2-digit', month: '2-digit'})}`;
                
                const dayGroup = document.createElement('div');
                dayGroup.className = 'day-group';
                
                const titleEl = document.createElement('div');
                titleEl.className = `day-title ${isToday ? 'today' : ''}`;
                titleEl.innerText = isToday ? `👉 Сегодня, ${dayTitle}` : dayTitle;
                dayGroup.appendChild(titleEl);

                const shifts = shiftsDB.filter(s => s.date === dateStr).sort((a,b) => a.start.localeCompare(b.start));
                
                if (shifts.length === 0) {
                    const empty = document.createElement('div');
                    empty.style.color = "#999";
                    empty.style.fontSize = "14px";
                    empty.style.marginLeft = "8px";
                    empty.innerText = "Выходной / Смен нет";
                    dayGroup.appendChild(empty);
                } else {
                    shifts.forEach(shift => {
                        const card = document.createElement('div');
                        card.className = `shift-card ${shift.master === 'Диана' ? 'diana' : 'nastya'}`;
                        
                        let actionsHtml = '';
                        if (shift.master === currentMaster) {
                            actionsHtml = `
                                <div class="card-actions">
                                    <button class="action-btn" onclick="editShift(${shift.id})">✏️</button>
                                    <button class="action-btn" onclick="deleteShift(${shift.id})">🗑️</button>
                                </div>
                            `;
                        }

                        card.innerHTML = `
                            ${actionsHtml}
                            <div class="master-name ${shift.master === 'Диана' ? 'diana' : 'nastya'}">${shift.master}</div>
                            <div>
                                <span class="time">${shift.start}–${shift.end}</span>
                                <span class="comment">(${shift.comment})</span>
                            </div>
                        `;
                        dayGroup.appendChild(card);
                    });
                }
                container.appendChild(dayGroup);
            });
        }

        function changeWeek(direction) {
            currentWeekOffset += direction;
            renderCalendar();
        }

        // --- МОДАЛЬНОЕ ОКНО ---
        function openModal() {
            editingShiftId = null; 
            document.getElementById('modal-title').innerText = "Новая смена";
            document.getElementById('save-btn').innerText = "Сохранить";
            document.getElementById('input-comment').value = "Педикюр";
            selectedStart = "10:00";
            selectedEnd = "18:00";
            
            const today = new Date();
            const yyyy = today.getFullYear();
            const mm = String(today.getMonth() + 1).padStart(2, '0');
            const dd = String(today.getDate()).padStart(2, '0');
            document.getElementById('input-date').value = `${yyyy}-${mm}-${dd}`;

            document.getElementById('display-start').innerText = selectedStart;
            document.getElementById('display-end').innerText = selectedEnd;

            document.getElementById('modal').classList.add('active');
            history.pushState({ page: "modal" }, ""); 
            renderTimeGrids();
        }

        function editShift(id) {
            const shift = shiftsDB.find(s => s.id === id);
            if (!shift) return;

            editingShiftId = id; 
            document.getElementById('modal-title').innerText = "Редактировать смену";
            document.getElementById('save-btn').innerText = "Обновить";
            
            document.getElementById('input-date').value = shift.date;
            document.getElementById('input-comment').value = shift.comment;
            selectedStart = shift.start;
            selectedEnd = shift.end;

            document.getElementById('display-start').innerText = selectedStart;
            document.getElementById('display-end').innerText = selectedEnd;

            document.getElementById('modal').classList.add('active');
            history.pushState({ page: "modal" }, ""); 
            renderTimeGrids();
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
        }

        function renderTimeGrids() {
            const gridStart = document.getElementById('grid-start');
            const gridEnd = document.getElementById('grid-end');
            gridStart.innerHTML = '';
            gridEnd.innerHTML = '';

            ALL_TIMES.forEach(time => {
                const cellS = document.createElement('div');
                cellS.className = `time-cell ${time === selectedStart ? 'selected' : ''}`;
                cellS.innerText = time;
                cellS.onclick = () => {
                    selectedStart = time;
                    document.getElementById('display-start').innerText = time;
                    renderTimeGrids();
                };
                gridStart.appendChild(cellS);

                const cellE = document.createElement('div');
                cellE.className = `time-cell ${time === selectedEnd ? 'selected' : ''}`;
                cellE.innerText = time;
                cellE.onclick = () => {
                    selectedEnd = time;
                    document.getElementById('display-end').innerText = time;
                    renderTimeGrids();
                };
                gridEnd.appendChild(cellE);
            });
        }
    </script>
