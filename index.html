<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>График мастеров</title>
    
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="manifest" href="manifest.json">
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #FFF0F5;
            --text-main: #2C2C2C;
            --card-bg: #FFFFFF;
            --green-light: #E8F5E9;
            --green-dark: #1B5E20;
            --green-border: #A5D6A7;
            --shadow: 0 4px 16px rgba(0,0,0,0.06);
            --pink-accent: #FF8DA1;
            --red-light: #FFEBEE;
            --red-dark: #C62828;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 20px; max-width: 500px; margin: 0 auto; padding-bottom: 80px; }
        h1 { font-size: 24px; font-weight: 700; margin-bottom: 20px; }

        .loading-screen { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: var(--bg-color); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; transition: opacity 0.4s ease, visibility 0.4s ease; }
        .loading-screen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
        .spinner { width: 50px; height: 50px; border: 5px solid var(--green-light); border-top: 5px solid var(--green-border); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .loading-text { font-weight: 600; color: var(--green-dark); font-size: 16px; text-align: center; line-height: 1.4; }

        .alert-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center; z-index: 10000; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; padding: 20px; }
        .alert-overlay.active { opacity: 1; pointer-events: auto; }
        .alert-box { background: var(--card-bg); padding: 24px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); width: 100%; max-width: 350px; text-align: center; transform: translateY(20px); transition: transform 0.3s ease; }
        .alert-overlay.active .alert-box { transform: translateY(0); }
        .alert-icon { font-size: 40px; margin-bottom: 15px; }
        .alert-title { font-weight: 700; font-size: 18px; margin-bottom: 10px; color: var(--text-main); }
        .alert-message { font-size: 14px; color: #666; margin-bottom: 20px; line-height: 1.4; }
        .alert-btn { background: var(--pink-accent); color: white; border: none; padding: 14px; border-radius: 12px; font-weight: 600; font-size: 16px; width: 100%; cursor: pointer; }
        
        .auth-screen { display: flex; flex-direction: column; gap: 15px; margin-top: 50px; }
        .btn { background: var(--card-bg); color: var(--text-main); border: none; padding: 16px; border-radius: 16px; font-size: 16px; font-weight: 600; cursor: pointer; box-shadow: var(--shadow); transition: transform 0.1s; text-align: center; width: 100%; }
        .btn:active { transform: scale(0.98); }
        .btn.primary { background: var(--green-light); color: var(--green-dark); box-shadow: inset 0 0 0 2px var(--green-border); }
        .btn.active { background: var(--green-light); color: var(--green-dark); box-shadow: inset 0 0 0 2px var(--green-border); }
        
        .input-group { display: flex; flex-direction: column; gap: 8px; margin-top: 15px; }
        input[type="password"], input[type="text"], input[type="date"] { background: var(--card-bg); border: none; padding: 16px; border-radius: 16px; font-size: 16px; box-shadow: var(--shadow); outline: none; color: var(--text-main); width: 100%; margin-bottom: 15px; }

        .hidden { display: none !important; }

        .week-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; margin-top: 20px; }
        .week-header span { font-weight: 700; font-size: 16px; }
        .week-nav { background: var(--card-bg); border: none; width: 40px; height: 40px; border-radius: 50%; box-shadow: var(--shadow); display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 18px; }

        .day-group { margin-bottom: 25px; padding-bottom: 25px; border-bottom: 2px dashed var(--pink-accent); }
        .day-group:last-child { border-bottom: none; padding-bottom: 0; }
        
        .day-title { display: inline-block; background: var(--card-bg); padding: 8px 16px; border-radius: 20px; font-weight: 600; font-size: 14px; box-shadow: var(--shadow); margin-bottom: 12px; border: 1px solid var(--pink-accent); }
        .day-title.today { background: var(--green-light); color: var(--green-dark); box-shadow: inset 0 0 0 2px var(--green-border); border: 1px solid var(--green-border); }

        .shift-card { background: var(--card-bg); padding: 16px; border-radius: 16px; box-shadow: var(--shadow); margin-bottom: 12px; border-left: 6px solid #ccc; position: relative; }
        .shift-card.diana { border-left-color: #4A90D9; }
        .shift-card.nastya { border-left-color: #D9534F; }
        .master-name { font-weight: 700; margin-bottom: 4px; }
        .master-name.diana { color: #4A90D9; }
        .master-name.nastya { color: #D9534F; }
        .time { font-weight: 600; font-size: 16px; }
        .comment { color: #777; font-size: 14px; margin-left: 5px; }
        
        .card-actions { position: absolute; top: 10px; right: 10px; display: flex; gap: 5px; }
        .action-btn { background: none; border: none; font-size: 18px; cursor: pointer; padding: 5px; }
        .action-btn:active { opacity: 0.5; }

        .logout-btn { background: var(--red-light); color: var(--red-dark); margin-top: 15px; }
        .settings-btn { background: #E3F2FD; color: #1565C0; margin-top: 15px; }

        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.4); display: flex; align-items: flex-end; justify-content: center; z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal { background: var(--bg-color); width: 100%; max-width: 500px; border-radius: 24px 24px 0 0; padding: 24px; transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); max-height: 95vh; overflow-y: auto; }
        .modal-overlay.active .modal { transform: translateY(0); }
        .modal h2 { font-size: 20px; margin-bottom: 20px; text-align: center; }

        .time-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-bottom: 15px; }
        .time-cell { background: var(--card-bg); padding: 8px 0; text-align: center; border-radius: 8px; font-weight: 600; font-size: 13px; cursor: pointer; box-shadow: var(--shadow); transition: all 0.2s; border: 1px solid var(--pink-accent); }
        .time-cell.selected { background: var(--green-light); color: var(--green-dark); box-shadow: inset 0 0 0 2px var(--green-border); border-color: var(--green-border); }

        .label { font-weight: 600; margin-bottom: 8px; display: block; font-size: 14px; }
        .close-modal { background: var(--red-light); color: var(--red-dark); margin-top: 10px; }

        .fab { position: fixed; bottom: 24px; right: 24px; width: 64px; height: 64px; border-radius: 32px; background: var(--green-border); color: var(--green-dark); font-size: 32px; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 20px rgba(165, 214, 167, 0.5); cursor: pointer; border: none; z-index: 50; }
    </style>
</head>
<body>

    <div id="loading-screen" class="loading-screen hidden">
        <div class="spinner"></div>
        <div class="loading-text">Загрузка...<br><span style="font-size:12px; font-weight:400; color:#777;">(Сервер просыпается, подождите)</span></div>
    </div>

    <div id="custom-alert" class="alert-overlay">
        <div class="alert-box">
            <div class="alert-icon">⚠️</div>
            <div class="alert-title">Внимание</div>
            <div class="alert-message" id="alert-text">Текст уведомления</div>
            <button class="alert-btn" onclick="closeAlert()">Понятно</button>
        </div>
    </div>

    <!-- ЭКРАН ВХОДА -->
    <div id="auth-screen" class="auth-screen">
        <h1>💅 График</h1>
        <p style="text-align: center; color: #777; margin-bottom: 10px;">Кто вы?</p>
        <div id="login-users-container" style="display: flex; gap: 10px;">
            <!-- Кнопки с именами будут добавлены через JS -->
        </div>
        
        <div class="input-group">
            <input type="password" id="password" placeholder="Пароль">
            <button class="btn primary" onclick="login()">Войти</button>
        </div>
    </div>

    <!-- ОСНОВНОЙ ЭКРАН -->
    <div id="main-screen" class="hidden">
        <h1 id="greeting">💅 График</h1>
        
        <div class="week-header">
            <button class="week-nav" onclick="changeWeek(-1)">←</button>
            <span id="week-range">Загрузка...</span>
            <button class="week-nav" onclick="changeWeek(1)">→</button>
        </div>

        <div id="calendar-container"></div>

        <button class="btn settings-btn" onclick="openSettingsModal()">⚙️ Настройки профиля</button>
        <button class="btn logout-btn" onclick="logout()">Выйти из профиля</button>
        <button class="fab" onclick="openModal()">+</button>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО СМЕНЫ -->
    <div class="modal-overlay" id="modal">
        <div class="modal">
            <h2 id="modal-title">Новая смена</h2>
            
            <label class="label">Дата смены</label>
            <input type="date" id="input-date">

            <label class="label">Услуга / Комментарий</label>
            <input type="text" id="input-comment" value="Педикюр">

            <label class="label">Время начала: <span id="display-start" style="color: #1B5E20;">10:00</span></label>
            <div class="time-grid" id="grid-start"></div>

            <label class="label">Время окончания: <span id="display-end" style="color: #1B5E20;">18:00</span></label>
            <div class="time-grid" id="grid-end"></div>

            <button class="btn primary" id="save-btn" onclick="saveShift()">Сохранить</button>
            <button class="btn close-modal" onclick="closeModal()">Отмена</button>
        </div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО НАСТРОЕК -->
    <div class="modal-overlay" id="settings-modal">
        <div class="modal">
            <h2>Настройки профиля</h2>
            
            <label class="label">Новое имя</label>
            <input type="text" id="settings-name" placeholder="Введите имя">

            <label class="label">Новый пароль (оставьте пустым, чтобы не менять)</label>
            <input type="password" id="settings-password" placeholder="Новый пароль">

            <button class="btn primary" onclick="saveSettings()">Сохранить изменения</button>
            <button class="btn close-modal" onclick="closeSettingsModal()">Отмена</button>
        </div>
    </div>

    <script>
        const API_URL = "https://nailscalendar.onrender.com"; 
        
        let currentMaster = null;
        let currentWeekOffset = 0;
        let selectedStart = "10:00";
        let selectedEnd = "18:00";
        let shiftsDB = []; 
        let editingShiftId = null; 
        let availableUsers = [];

        const ALL_TIMES = [];
        for (let h = 8; h < 24; h++) {
            ALL_TIMES.push(`${h.toString().padStart(2, '0')}:00`);
            ALL_TIMES.push(`${h.toString().padStart(2, '0')}:30`);
        }

        // --- КНОПКА НАЗАД ---
        let backPressCount = 0;
        let backPressTimer = null;
        history.pushState({ page: "main" }, "");

        window.addEventListener('popstate', function (e) {
            const modal = document.getElementById('modal');
            const settingsModal = document.getElementById('settings-modal');
            
            if (modal.classList.contains('active')) {
                closeModal();
                history.pushState({ page: "main" }, "");
                return;
            }
            if (settingsModal.classList.contains('active')) {
                closeSettingsModal();
                history.pushState({ page: "main" }, "");
                return;
            }

            if (backPressCount === 0) {
                backPressCount++;
                history.pushState({ page: "main" }, ""); 
                showAlert("Нажмите 'Назад' еще раз, чтобы выйти.");
                backPressTimer = setTimeout(() => { backPressCount = 0; }, 2000); 
            } else {
                clearTimeout(backPressTimer);
                history.back();
            }
        });

        // --- УТИЛИТЫ ---
        function showLoading() { document.getElementById('loading-screen').classList.remove('hidden'); }
        function hideLoading() { document.getElementById('loading-screen').classList.add('hidden'); }
        function showAlert(message) { document.getElementById('alert-text').innerText = message; document.getElementById('custom-alert').classList.add('active'); }
        function closeAlert() { document.getElementById('custom-alert').classList.remove('active'); }

        // --- ПОЛЬЗОВАТЕЛИ ---
        async function loadUsers() {
            try {
                const response = await fetch(`${API_URL}/users`);
                availableUsers = await response.json();
                
                const container = document.getElementById('login-users-container');
                container.innerHTML = '';
                availableUsers.forEach(user => {
                    const btn = document.createElement('button');
                    btn.className = 'btn';
                    btn.innerText = user.name;
                    btn.onclick = () => selectMaster(user.name, btn);
                    container.appendChild(btn);
                });
            } catch (e) {
                console.error("Не удалось загрузить пользователей", e);
            }
        }

        function selectMaster(name, btnElement) {
            document.querySelectorAll('#login-users-container .btn').forEach(b => b.classList.remove('active'));
            btnElement.classList.add('active');
            currentMaster = name;
        }

        async function login() {
            const pwd = document.getElementById('password').value;
            if (!currentMaster) {
                showAlert("Пожалуйста, выберите имя!");
                return;
            }

            showLoading();
            try {
                const response = await fetch(`${API_URL}/login`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ name: currentMaster, password: pwd })
                });
                
                if (response.ok) {
                    localStorage.setItem('nailsMaster', currentMaster);
                    document.getElementById('auth-screen').classList.add('hidden');
                    document.getElementById('main-screen').classList.remove('hidden');
                    document.getElementById('greeting').innerText = `💅 Привет, ${currentMaster}`;
                    loadShifts(); 
                } else {
                    hideLoading();
                    showAlert("Неверный пароль!");
                }
            } catch (e) {
                hideLoading();
                showAlert("Ошибка соединения с сервером");
            }
        }

        function logout() {
            localStorage.removeItem('nailsMaster');
            location.reload();
        }

        // --- НАСТРОЙКИ ---
        function openSettingsModal() {
            document.getElementById('settings-name').value = currentMaster;
            document.getElementById('settings-password').value = '';
            document.getElementById('settings-modal').classList.add('active');
            history.pushState({ page: "settings" }, ""); 
        }

        function closeSettingsModal() {
            document.getElementById('settings-modal').classList.remove('active');
        }

        async function saveSettings() {
            const newName = document.getElementById('settings-name').value.trim();
            const newPassword = document.getElementById('settings-password').value;

            if (!newName) {
                showAlert("Имя не может быть пустым!");
                return;
            }

            showLoading();
            try {
                const response = await fetch(`${API_URL}/users`, {
                    method: 'PUT',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ 
                        old_name: currentMaster, 
                        new_name: newName, 
                        new_password: newPassword 
                    })
                });
                
                if (response.ok) {
                    const data = await response.json();
                    currentMaster = data.new_name;
                    localStorage.setItem('nailsMaster', currentMaster);
                    document.getElementById('greeting').innerText = `💅 Привет, ${currentMaster}`;
                    closeSettingsModal();
                    showAlert("Настройки успешно сохранены!");
                    loadShifts(); // Перезагружаем смены, чтобы обновить имя в карточках
                } else {
                    const error = await response.json();
                    hideLoading();
                    showAlert(error.detail); 
                }
            } catch (e) {
                hideLoading();
                showAlert("Ошибка соединения с сервером");
            }
        }

        // --- ЗАГРУЗКА СМЕН ---
        async function loadShifts() {
            try {
                const response = await fetch(`${API_URL}/shifts`);
                if (!response.ok) throw new Error("Ошибка сервера");
                shiftsDB = await response.json();
                renderCalendar(); 
                hideLoading(); 
            } catch (e) {
                console.error(e);
                hideLoading(); 
                showAlert("Не удалось загрузить данные.");
            }
        }

        async function saveShift() {
            if (selectedStart >= selectedEnd) { showAlert("Время окончания должно быть позже начала!"); return; }
            const comment = document.getElementById('input-comment').value;
            const selectedDate = document.getElementById('input-date').value;
            if (!selectedDate) { showAlert("Выберите дату!"); return; }

            const shiftData = { master: currentMaster, date: selectedDate, start: selectedStart, end: selectedEnd, comment: comment };
            showLoading(); 
            try {
                let url = `${API_URL}/shifts`;
                let method = 'POST';
                if (editingShiftId !== null) { url = `${API_URL}/shifts/${editingShiftId}`; method = 'PUT'; }

                const response = await fetch(url, { method: method, headers: {'Content-Type': 'application/json'}, body: JSON.stringify(shiftData) });
                
                if (!response.ok) {
                    const error = await response.json(); hideLoading(); showAlert(error.detail); 
                } else {
                    closeModal(); loadShifts(); 
                }
            } catch (e) { hideLoading(); showAlert("Ошибка соединения"); }
        }

        async function deleteShift(id) {
            if (confirm("Удалить эту смену?")) {
                showLoading(); 
                try { await fetch(`${API_URL}/shifts/${id}`, { method: 'DELETE' }); loadShifts(); } 
                catch (e) { hideLoading(); showAlert("Ошибка удаления"); }
            }
        }

        // --- КАЛЕНДАРЬ ---
        function getWeekDates(offset) {
            const today = new Date();
            const dayOfWeek = today.getDay() === 0 ? 6 : today.getDay() - 1; 
            const startOfWeek = new Date(today);
            startOfWeek.setDate(today.getDate() - dayOfWeek + (offset * 7));
            const dates = [];
            for (let i = 0; i < 7; i++) { const d = new Date(startOfWeek); d.setDate(startOfWeek.getDate() + i); dates.push(d); }
            return dates;
        }

        function formatDate(date) {
            return `${date.getFullYear()}-${(date.getMonth() + 1).toString().padStart(2, '0')}-${date.getDate().toString().padStart(2, '0')}`;
        }

        function renderCalendar() {
            const dates = getWeekDates(currentWeekOffset);
            const container = document.getElementById('calendar-container');
            container.innerHTML = '';
            const startStr = dates[0].toLocaleDateString('ru-RU', {day: '2-digit', month: '2-digit', year: 'numeric'});
            const endStr = dates[6].toLocaleDateString('ru-RU', {day: '2-digit', month: '2-digit', year: 'numeric'});
            document.getElementById('week-range').innerText = `${startStr} — ${endStr}`;

            const todayStr = formatDate(new Date());
            const daysRu = ["Пн", "Вт", "Ср", "Чт", "Пт", "Сб", "Вс"];

            dates.forEach((date, index) => {
                const dateStr = formatDate(date);
                const isToday = dateStr === todayStr;
                const dayTitle = `${daysRu[index]}, ${date.toLocaleDateString('ru-RU', {day: '2-digit', month: '2-digit'})}`;
                
                const dayGroup = document.createElement('div');
                dayGroup.className = 'day-group';
                
                const titleEl = document.createElement('div');
                titleEl.className = `day-title ${isToday ? 'today' : ''}`;
                titleEl.innerText = isToday ? `👉 Сегодня, ${dayTitle}` : dayTitle;
                dayGroup.appendChild(titleEl);

                const shifts = shiftsDB.filter(s => s.date === dateStr).sort((a,b) => a.start.localeCompare(b.start));
                
                if (shifts.length === 0) {
                    const empty = document.createElement('div');
                    empty.style.cssText = "color:#999; font-size:14px; margin-left:8px;";
                    empty.innerText = "Выходной / Смен нет";
                    dayGroup.appendChild(empty);
                } else {
                    shifts.forEach(shift => {
                        const card = document.createElement('div');
                        card.className = `shift-card ${shift.master === 'Диана' ? 'diana' : 'nastya'}`;
                        
                        let actionsHtml = '';
                        if (shift.master === currentMaster) {
                            actionsHtml = `<div class="card-actions"><button class="action-btn" onclick="editShift(${shift.id})">✏️</button><button class="action-btn" onclick="deleteShift(${shift.id})">🗑️</button></div>`;
                        }

                        card.innerHTML = `
                            ${actionsHtml}
                            <div class="master-name ${shift.master === 'Диана' ? 'diana' : 'nastya'}">${shift.master}</div>
                            <div><span class="time">${shift.start}–${shift.end}</span><span class="comment">(${shift.comment})</span></div>
                        `;
                        dayGroup.appendChild(card);
                    });
                }
                container.appendChild(dayGroup);
            });
        }

        function changeWeek(direction) { currentWeekOffset += direction; renderCalendar(); }

        // --- МОДАЛЬНОЕ ОКНО СМЕНЫ ---
        function openModal() {
            editingShiftId = null; 
            document.getElementById('modal-title').innerText = "Новая смена";
            document.getElementById('save-btn').innerText = "Сохранить";
            document.getElementById('input-comment').value = "Педикюр";
            selectedStart = "10:00"; selectedEnd = "18:00";
            document.getElementById('input-date').value = formatDate(new Date());
            document.getElementById('display-start').innerText = selectedStart;
            document.getElementById('display-end').innerText = selectedEnd;
            document.getElementById('modal').classList.add('active');
            history.pushState({ page: "modal" }, ""); 
            renderTimeGrids();
        }

        function editShift(id) {
            const shift = shiftsDB.find(s => s.id === id);
            if (!shift) return;
            editingShiftId = id; 
            document.getElementById('modal-title').innerText = "Редактировать смену";
            document.getElementById('save-btn').innerText = "Обновить";
            document.getElementById('input-date').value = shift.date;
            document.getElementById('input-comment').value = shift.comment;
            selectedStart = shift.start; selectedEnd = shift.end;
            document.getElementById('display-start').innerText = selectedStart;
            document.getElementById('display-end').innerText = selectedEnd;
            document.getElementById('modal').classList.add('active');
            history.pushState({ page: "modal" }, ""); 
            renderTimeGrids();
        }
